<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- A folha pede DejaVu Sans, mas foi medida em Noto Sans, que é a que o
     fontconfig entrega na máquina de desenvolvimento. Aqui isso fica explícito:
     a fonte da chave impressa afeta a leitura dela. -->
<fontconfig>
  <match target="pattern">
    <test qual="any" name="family"><string>DejaVu Sans</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans</string></edit>
  </match>
</fontconfig>
