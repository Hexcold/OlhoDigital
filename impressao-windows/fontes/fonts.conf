<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- A folha pede DejaVu Sans, mas a chave impressa foi medida em Noto Sans (A49), e a
     fonte afeta a leitura dela. Sem isto o Windows entregaria Verdana, sem erro nenhum.
     Só esta pasta é consultada: fonte instalada no computador não entra. -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <!-- `relative` aqui valeria para a pasta em que o programa roda, não para este arquivo.
       `xdg` lê XDG_CACHE_HOME, que `abrir.py` aponta para a pasta do usuário. -->
  <cachedir prefix="xdg">fontes</cachedir>
  <match target="pattern">
    <test qual="any" name="family"><string>DejaVu Sans</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Sans</string></edit>
  </match>
</fontconfig>
